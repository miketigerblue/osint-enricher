name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    name: Security & Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Python setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Secret scanning (GitHub Advanced Security)
      - name: Secret scan
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Run secret scanning
        uses: github/codeql-action/analyze@v3

      # Dependency vulnerability scan
      - name: Safety check (vulnerability scan)
        run: |
          pip install safety
          safety check --full-report

      # Static code analysis (Bandit for security)
      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r enricher/ -ll

  lint-and-test:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Lint with ruff (fast modern linter)
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check enricher/

      # Format check with black
      - name: Check formatting with black
        run: |
          pip install black
          black --check enricher/

      # Run type checks (optional, if using type hints and mypy)
      - name: Type check with mypy
        run: |
          pip install mypy
          mypy enricher/

      # Run tests (pytest)
      - name: Run tests
        run: |
          pip install pytest
          pytest tests/

  docker-build:
    name: Build & Push Docker (on main)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  # Optionally add notifications or Slack integration here

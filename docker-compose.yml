volumes:
  chroma_data:

services:
  enricher:
    build: ./enricher
    image: osint_enricher:latest
    env_file:
      - .env
    environment:
      # must match the Postgres container’s USER/PW/DB and network alias "db"
      DATABASE_URL: "postgresql://user:pass@db:5432/osint"
      CHROMA_DB_PATH: "/app/chroma_db"
      ENRICH_INTERVAL: "3600"
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - osint_net

networks:
  osint_net:
    external: true
    name: rust-feed-ingestor_osint_net



